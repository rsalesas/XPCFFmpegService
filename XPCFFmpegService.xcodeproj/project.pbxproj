			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Set this to see all commands executing\n# set -e\n\n# Check that the FFmpeg submodule is cloned and initialized\nif [ ! -d \"${PROJECT_DIR}/FFmpeg/fftools\" ]; then\n    echo \"ERROR: FFmpeg submodule is missing or not initialized. Run: git submodule update --init\"\n    exit 1\nfi\n\n# Check that HomeBrew is installed\nif ! which brew > /dev/null; then\n    echo \"ERROR: brew is missing. Install it from https://brew.sh\"\n    exit 1\nfi\n\n# Check that pkg-config is installed\nif ! which pkg-config > /dev/null; then\n    echo \"ERROR: pkg-config is missing. Run: brew install pkg-config\"\n    exit 1\nfi\n\n# Every codec library FFmpeg is configured against below, as Homebrew formula : static\n# archive. Adding one here is not enough on its own - it also has to be linked into\n# FFmpegTask (OTHER_LDFLAGS on that target) and listed in NOTICE.\n#\n# All of these are BSD or LGPL, which leaves the combined work GPL v3 exactly as x264 and\n# x265 already make it. Nothing non-free (libfdk-aac) belongs in this list.\nCODEC_LIBRARIES=\"x264:libx264.a x265:libx265.a lame:libmp3lame.a libvpx:libvpx.a \\\n                 opus:libopus.a libogg:libogg.a libvorbis:libvorbis.a libvorbis:libvorbisenc.a \\\n                 aom:libaom.a libvmaf:libvmaf.a\"\n\nfor formula in nasm $(echo \"${CODEC_LIBRARIES}\" | tr \" \" \"\\n\" | cut -d: -f1 | sort -u); do\n    if ! brew ls --versions \"${formula}\" > /dev/null; then\n        echo \"ERROR: ${formula} is missing. Run: brew install ${formula}\"\n        exit 1\n    fi\ndone\n\n# Copy each static archive into lib/, where FFmpegTask links against it, and collect the\n# pkgconfig directories configure needs to find them. Homebrew's prefix differs between\n# Apple Silicon (/opt/homebrew) and Intel (/usr/local) Macs, so ask brew instead of hardcoding it.\nmkdir -p \"${PROJECT_DIR}/lib\"\nCODEC_PKG_CONFIG_PATH=\"\"\nCODEC_CFLAGS=\"\"\nCODEC_LDFLAGS=\"\"\nfor entry in $(echo \"${CODEC_LIBRARIES}\" | tr -s \" \\n\" \" \"); do\n    prefix=$(brew --prefix \"${entry%%:*}\")\n    ditto \"${prefix}/lib/${entry##*:}\" \"${PROJECT_DIR}/lib/${entry##*:}\"\n    CODEC_PKG_CONFIG_PATH=\"${CODEC_PKG_CONFIG_PATH}${prefix}/lib/pkgconfig:\"\n\n    # Not every library ships a pkg-config file - lame does not - so configure has to be\n    # pointed at the headers and archives directly. Two formulae can share a prefix, hence\n    # the check against adding the same -I twice.\n    case \" ${CODEC_CFLAGS} \" in\n        *\" -I${prefix}/include \"*) ;;\n        *) CODEC_CFLAGS=\"${CODEC_CFLAGS} -I${prefix}/include\"\n           CODEC_LDFLAGS=\"${CODEC_LDFLAGS} -L${prefix}/lib\" ;;\n    esac\ndone\n\n# Create the build directory if it doesn't already exist\nmkdir -p \"${CONFIGURATION_BUILD_DIR}\"\n\n# Build FFmpeg for whichever single architecture Xcode is currently targeting, matching\n# ONLY_ACTIVE_ARCH / ARCHS on the target so the static libs match what FFmpegTask links against.\nFFMPEG_ARCH=\"${ARCHS%% *}\"\n\n# Set the ffmpeg configuration\ncd \"${PROJECT_DIR}/FFmpeg\"\nexport PKG_CONFIG_PATH=\"${CODEC_PKG_CONFIG_PATH}\"\n./configure --prefix=\"${CONFIGURATION_BUILD_DIR}\" --arch=\"${FFMPEG_ARCH}\" cc=\"clang\" \\\n    --extra-cflags=\"-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}${CODEC_CFLAGS}\" \\\n    --extra-ldflags=\"${CODEC_LDFLAGS}\" --pkg-config=\"pkg-config --static\" \\\n    --libdir=\"${PROJECT_DIR}/lib\" --incdir=\"${PROJECT_DIR}/include\" --shlibdir=\"${PROJECT_DIR}/Frameworks\" \\\n    --fatal-warnings --disable-shared --enable-static --enable-pthreads --enable-gpl --enable-version3 \\\n    --disable-sdl2 --disable-xlib --disable-libxcb \\\n    --enable-libx264 --enable-libx265 \\\n    --enable-libmp3lame --enable-libvpx --enable-libopus --enable-libvorbis --enable-libaom \\\n    --disable-programs --disable-doc \\\n    || { echo \"ERROR: FFmpeg configure failed - see ${PROJECT_DIR}/FFmpeg/ffbuild/config.log\"; exit 1; }\n\n# Make the ffmpeg libraries and install them (headers land in include/, but Xcode's header\n# search path points straight at the FFmpeg source tree instead - see HEADER_SEARCH_PATHS -\n# since ffmpeg.c/ffprobe.c/fftools/*.c reach for internal headers that \"make install\" does not export)\nmake -j$(sysctl -n hw.ncpu) || exit 1\nmake install || exit 1\n\n# fftools/graph/graphprint.c (new in FFmpeg 8) embeds a debug HTML/CSS viewer that FFmpeg's own\n# Makefile normally generates via its bin2c tool. Since this target compiles the fftools sources\n# directly instead of going through that Makefile, regenerate the equivalent C sources here.\nmkdir -p \"${PROJECT_DIR}/generated\"\nxxd -i fftools/resources/graph.html \\\n    | sed -e 's/^unsigned char fftools_resources_graph_html\\[\\]/const unsigned char ff_graph_html_data[]/' \\\n          -e 's/^unsigned int fftools_resources_graph_html_len/const unsigned int ff_graph_html_len/' \\\n    > \"${PROJECT_DIR}/generated/graph_html.c\"\nxxd -i fftools/resources/graph.css \\\n    | sed -e 's/^unsigned char fftools_resources_graph_css\\[\\]/const unsigned char ff_graph_css_data[]/' \\\n          -e 's/^unsigned int fftools_resources_graph_css_len/const unsigned ff_graph_css_len/' \\\n    > \"${PROJECT_DIR}/generated/graph_css.c\"\n\ncd -\n\nexit 0\n";
		};
