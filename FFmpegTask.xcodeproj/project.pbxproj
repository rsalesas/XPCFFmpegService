			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Set this to see all commands executing\n# set -e\n\n# Check that HomeBrew is installed\nif ! which brew > /dev/null; then\n  echo \"ERROR: brew is missing.\"\n  exit 1\nfi\n\n# Check that nasm is installed\nif ! brew ls --versions nasm > /dev/null; then\n    echo \"ERROR: nasm is missing.\"\n    exit 1\nfi\n\n# Check that pkg-config is installed\nif ! brew ls --versions pkg-config > /dev/null; then\n    echo \"ERROR: pkg-config is missing.\"\n    exit 1\nfi\n\n# Check that x264 is installed\nif ! brew ls --versions x264 > /dev/null; then\n    echo \"ERROR: x264 is missing.\"\n    exit 1\nfi\n\n# Check that x265 is installed\nif ! brew ls --versions x265 > /dev/null; then\n    echo \"ERROR: x265 is missing.\"\n    exit 1\nfi\n\n# Copy the x264 and x265 .a files to the main folder\nditto /usr/local/lib/libx264.a ${PROJECT_DIR}/lib/libx264.a\nditto /usr/local/lib/libx265.a ${PROJECT_DIR}/lib/libx265.a\n\n# Clone FFmpeg if it's not already there, and otherwise update it\nif [ ! -d ${PROJECT_DIR}/FFmpeg ]; then\n    mkdir -p ${PROJECT_DIR}/FFmpeg;\n    git clone -b release/4.2 https://github.com/FFmpeg/FFmpeg.git \"${PROJECT_DIR}/FFmpeg\";\nelse\n    # git fetch ${PROJECT_DIR}/FFmpeg\n    exit 0\nfi\n\n# Create the build directory if it doesn't already exist\nmkdir -p ${CONFIGURATION_BUILD_DIR}\n\n# Set the ffmpeg configuration\ncd ${PROJECT_DIR}/FFmpeg\n./configure --prefix=${CONFIGURATION_BUILD_DIR} --arch=x86_64 cc=\"clang\" \\\n    --extra-cflags=\"-fno-stack-check -mmacosx-version-min=10.13\" --pkg-config=\"pkg-config --static\" \\\n    --libdir=${PROJECT_DIR}/lib --incdir=${PROJECT_DIR}/include --shlibdir=${PROJECT_DIR}/Frameworks \\\n    --fatal-warnings --disable-shared --enable-static --enable-pthreads --enable-gpl --enable-version3 \\\n    --disable-avresample --disable-sdl2 --disable-bzlib --disable-xlib --disable-zlib \\\n    --enable-libx264 --enable-libx265 \\\n    --disable-programs --disable-doc \n\n# Copy config.h to the main folder\nditto ${PROJECT_DIR}/FFmpeg/config.h ${PROJECT_DIR}/include/config.h\n\n# Make the ffmpeg project\nmake\nmake install\ncd -\n\n# Copy missing .h files to main folder\nditto ${PROJECT_DIR}/FFmpeg/libavresample/avresample.h ${PROJECT_DIR}/include/libavresample/avresample.h\nditto ${PROJECT_DIR}/FFmpeg/libavresample/version.h ${PROJECT_DIR}/include/libavresample/version.h\nditto ${PROJECT_DIR}/FFmpeg/libavformat/network.h ${PROJECT_DIR}/include/libavformat/network.h\nditto ${PROJECT_DIR}/FFmpeg/libavformat/url.h ${PROJECT_DIR}/include/libavformat/url.h\nditto ${PROJECT_DIR}/FFmpeg/libavformat/os_support.h ${PROJECT_DIR}/include/libavformat/os_support.h\nditto ${PROJECT_DIR}/FFmpeg/libavutil/libm.h ${PROJECT_DIR}/include/libavutil/libm.h\nditto ${PROJECT_DIR}/FFmpeg/libavutil/internal.h ${PROJECT_DIR}/include/libavutil/internal.h\nditto ${PROJECT_DIR}/FFmpeg/libavutil/timer.h ${PROJECT_DIR}/include/libavutil/timer.h\nditto ${PROJECT_DIR}/FFmpeg/libavutil/reverse.h ${PROJECT_DIR}/include/libavutil/reverse.h\nditto ${PROJECT_DIR}/FFmpeg/libavutil/thread.h ${PROJECT_DIR}/include/libavutil/thread.h\nditto ${PROJECT_DIR}/FFmpeg/libavutil/x86/asm.h ${PROJECT_DIR}/include/libavutil/x86/asm.h\nditto ${PROJECT_DIR}/FFmpeg/libavutil/x86/timer.h ${PROJECT_DIR}/include/libavutil/x86/timer.h\nditto ${PROJECT_DIR}/FFmpeg/libavutil/x86/emms.h ${PROJECT_DIR}/include/libavutil/x86/emms.h\nditto ${PROJECT_DIR}/FFmpeg/libavcodec/mathops.h ${PROJECT_DIR}/include/libavcodec/mathops.h\nditto ${PROJECT_DIR}/FFmpeg/libavcodec/x86/mathops.h ${PROJECT_DIR}/include/libavcodec/x86/mathops.h\nditto ${PROJECT_DIR}/FFmpeg/compat/va_copy.h ${PROJECT_DIR}/include/compat/va_copy.h\n\nexit 0\n";
